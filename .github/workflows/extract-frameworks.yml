name: Extract macOS 26 Frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-frameworks:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw Binary Directly
        run: |
          gh release download --repo blacktop/ipsw --pattern "*macOS_x86_64.tar.gz" --clobber
          tar -zxvf ipsw*.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/
          ipsw version

      - name: Download & Extract dyld_shared_cache from macOS 26
        run: |
          mkdir -p payloads/Frameworks/26_0/System/Library/Frameworks
          mkdir -p payloads/Frameworks/26_0/System/Library/PrivateFrameworks

          # Telechargement et extraction
          ipsw download dyld --mac --version 26.0 --arch x86_64 || true
          ipsw dyld extract dyld_shared_cache_x86_64 SkyLight CoreGraphics || true

      - name: Commit Extracted Frameworks
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add payloads/Frameworks/26_0/
          git commit -m "Auto-extract : Ajout des vrais binaires x86_64 SkyLight et CoreGraphics" || exit 0
          git push
