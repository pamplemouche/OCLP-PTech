name: Extract x86_64 Frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-frameworks:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        run: |
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /usr/local/share/dotnet

      - name: Install ipsw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blacktop/ipsw --pattern "ipsw_*_macOS_x86_64.tar.gz" --clobber
          tar -zxvf ipsw_*_macOS_x86_64.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/
          ipsw version

      - name: Download InstallAssistant & Mount Cryptex DMG
        run: |
          mkdir -p payloads/Frameworks/26_0/System/Library/Frameworks
          mkdir -p payloads/Frameworks/26_0/System/Library/PrivateFrameworks

          # 1. Telechargement du package
          ipsw download macos --latest -a -y

          PKG_PATH=$(find . -name "*.pkg" | head -n 1)
          echo "Package trouve : $PKG_PATH"

          # 2. Extraction du paquet
          pkgutil --expand-full "$PKG_PATH" pkg_expanded
          rm -rf "$PKG_PATH"

          # 3. Recherche et montage du DMG interne
          DMG_PATH=$(find pkg_expanded -name "*.dmg" | grep -iE "cryptex|shared|system" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            DMG_PATH=$(find pkg_expanded -name "*.dmg" | head -n 1)
          fi
          echo "DMG trouve : $DMG_PATH"

          # Montage sur /Volumes/Cryptex
          hdiutil attach "$DMG_PATH" -mountpoint /Volumes/Cryptex -nobrowse

          # 4. Localisation du dyld_shared_cache_x86_64 dans /Volumes/Cryptex
          CACHE_PATH=$(find /Volumes/Cryptex -name "dyld_shared_cache_x86_64" | head -n 1)
          echo "Cache trouve : $CACHE_PATH"

          # 5. Extraction des frameworks x86_64
          ipsw dyld extract "$CACHE_PATH" SkyLight CoreGraphics -o extracted_dylibs

          # Demonter le volume DMG
          hdiutil detach /Volumes/Cryptex || true

      - name: Organize & Commit Extracted Frameworks
        run: |
          if [ -d "extracted_dylibs" ]; then
            cp -R extracted_dylibs/SkyLight.framework payloads/Frameworks/26_0/System/Library/PrivateFrameworks/ || true
            cp -R extracted_dylibs/CoreGraphics.framework payloads/Frameworks/26_0/System/Library/Frameworks/ || true
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add payloads/Frameworks/26_0/
          git commit -m "Auto-extract : Ajout des binaires x86_64 SkyLight et CoreGraphics" || exit 0
          git push
