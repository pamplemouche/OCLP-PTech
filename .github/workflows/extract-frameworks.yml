name: Extract macOS 26 Frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-frameworks:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blacktop/ipsw --pattern "ipsw_*_macOS_x86_64.tar.gz" --clobber
          tar -zxvf ipsw_*_macOS_x86_64.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/
          ipsw version

      - name: Download KDK & Extract Frameworks
        run: |
          mkdir -p payloads/Frameworks/26_0/System/Library/Frameworks
          mkdir -p payloads/Frameworks/26_0/System/Library/PrivateFrameworks

          # Telechargement du Kernel Debug Kit
          ipsw download kdk --latest -y

          # Extraction des frameworks depuis le fichier DMG du KDK
          ipsw dyld extract *.dmg SkyLight CoreGraphics -o extracted_dylibs || true

      - name: Organize & Commit Extracted Frameworks
        run: |
          if [ -d "extracted_dylibs" ]; then
            cp -R extracted_dylibs/SkyLight.framework payloads/Frameworks/26_0/System/Library/PrivateFrameworks/ || true
            cp -R extracted_dylibs/CoreGraphics.framework payloads/Frameworks/26_0/System/Library/Frameworks/ || true
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add payloads/Frameworks/26_0/
          git commit -m "Auto-extract : Ajout des dylibs x86_64 via KDK" || exit 0
          git push
