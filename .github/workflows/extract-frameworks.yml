name: Extract macOS 26 Frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-frameworks:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CommandLineTools

      - name: Install ipsw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blacktop/ipsw --pattern "ipsw_*_macOS_x86_64.tar.gz" --clobber
          tar -zxvf ipsw_*_macOS_x86_64.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/
          ipsw version

      - name: Download macOS 26 Installer & Extract Dyld Cache
        run: |
          mkdir -p payloads/Frameworks/26_0/System/Library/Frameworks
          mkdir -p payloads/Frameworks/26_0/System/Library/PrivateFrameworks
          
          # Telechargement du package macOS 26 via la commande officielle
          ipsw download macos --version 26.0 --latest
          
          # Extraction depuis l'IPSW / Installer telecharge
          ipsw extract --dyld *.ipsw || ipsw extract --dyld *.pkg
          
          # Extraction des frameworks x86_64
          ipsw dyld extract dyld_shared_cache_x86_64 SkyLight CoreGraphics -o extracted_dylibs

      - name: Organize & Commit Extracted Frameworks
        run: |
          cp -R extracted_dylibs/SkyLight.framework payloads/Frameworks/26_0/System/Library/PrivateFrameworks/
          cp -R extracted_dylibs/CoreGraphics.framework payloads/Frameworks/26_0/System/Library/Frameworks/
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add payloads/Frameworks/26_0/
          git commit -m "Auto-extract : Ajout des vrais binaires x86_64 SkyLight et CoreGraphics"
          git push
