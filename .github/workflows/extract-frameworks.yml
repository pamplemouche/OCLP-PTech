name: Extract x86_64 Frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-frameworks:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        run: |
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Library/Developer/CommandLineTools
          sudo rm -rf /usr/local/share/dotnet

      - name: Install ipsw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blacktop/ipsw --pattern "ipsw_*_macOS_x86_64.tar.gz" --clobber
          tar -zxvf ipsw_*_macOS_x86_64.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/
          ipsw version

      - name: Download InstallAssistant & Mount Nested Cryptex DMG
        run: |
          mkdir -p payloads/Frameworks/26_0/System/Library/Frameworks
          mkdir -p payloads/Frameworks/26_0/System/Library/PrivateFrameworks

          # 1. Telechargement du paquet
          ipsw download macos --latest -a -y

          PKG_PATH=$(find . -name "*.pkg" | head -n 1)
          echo "Package trouve : $PKG_PATH"

          # 2. Extraction du paquet
          pkgutil --expand-full "$PKG_PATH" pkg_expanded
          rm -rf "$PKG_PATH"

          # 3. Montage du premier DMG (SharedSupport.dmg)
          MAIN_DMG=$(find pkg_expanded -name "*.dmg" | head -n 1)
          echo "DMG principal trouve : $MAIN_DMG"
          hdiutil attach "$MAIN_DMG" -mountpoint /Volumes/SharedSupport -nobrowse

          # 4. Recherche et montage du DMG systeme imbrique (CryptexOS / OS.dmg)
          NESTED_DMG=$(find /Volumes/SharedSupport -name "*.dmg" | grep -iE "cryptex|os" | head -n 1)
          if [ -z "$NESTED_DMG" ]; then
            NESTED_DMG=$(find /Volumes/SharedSupport -name "*.dmg" | head -n 1)
          fi
          echo "DMG imbrique trouve : $NESTED_DMG"

          hdiutil attach "$NESTED_DMG" -mountpoint /Volumes/CryptexOS -nobrowse

          # 5. Recherche du dyld_shared_cache dans le volume systeme reel
          CACHE_PATH=$(find /Volumes/CryptexOS -type f -name "*dyld_shared_cache*" 2>/dev/null | grep -v "\.map" | head -n 1)
          echo "Cache trouve : $CACHE_PATH"

          # 6. Extraction globale avec -a
          if [ -n "$CACHE_PATH" ]; then
            ipsw dyld extract "$CACHE_PATH" -a -o extracted_dylibs
          else
            echo "Erreur : Aucun cache dyld trouve dans le DMG imbrique !"
            exit 1
          fi

          hdiutil detach /Volumes/CryptexOS || true
          hdiutil detach /Volumes/SharedSupport || true

      - name: Filter & Commit Frameworks
        run: |
          SKYLIGHT_PATH=$(find extracted_dylibs -name "*SkyLight*" | head -n 1)
          COREGRAPHICS_PATH=$(find extracted_dylibs -name "*CoreGraphics*" | head -n 1)

          if [ -n "$SKYLIGHT_PATH" ]; then
            cp -R "$SKYLIGHT_PATH" payloads/Frameworks/26_0/System/Library/PrivateFrameworks/
          fi

          if [ -n "$COREGRAPHICS_PATH" ]; then
            cp -R "$COREGRAPHICS_PATH" payloads/Frameworks/26_0/System/Library/Frameworks/
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add payloads/Frameworks/26_0/
          git commit -m "Auto-extract : Ajout des binaires x86_64 depuis le DMG imbrique" || exit 0
          git push
