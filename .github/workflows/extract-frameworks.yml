name: Extract Frameworks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract-frameworks:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download InstallAssistant Package
        run: |
          set -e
          echo "Téléchargement de InstallAssistant.pkg..."

          # URL directe Apple CDN avec User-Agent Mac et drapeau --fail (-f)
          URL="https://swcdn.apple.com/content/downloads/12/32/062-38600-A_9E3K8S0C12/k69e38z9hvwx881v23851b4c48p53j5o40/InstallAssistant.pkg"

          curl -fL -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" --retry 3 "$URL" -o InstallAssistant.pkg

          FILE_SIZE=$(stat -f%z InstallAssistant.pkg 2>/dev/null || echo 0)
          echo "Taille du fichier téléchargé : $FILE_SIZE octets"

          if [ "$FILE_SIZE" -lt 1000000000 ]; then
            echo "::error::Fichier incomplet ou introuvable sur le CDN ($FILE_SIZE octets)."
            exit 1
          fi

      - name: Mount Nested Cryptex DMG
        run: |
          set -e

          PKG_PATH="InstallAssistant.pkg"
          echo "Package valide trouvé : $PKG_PATH"

          # 1. Expansion du paquet PKG
          echo "Extraction de la structure PKG..."
          pkgutil --expand-full "$PKG_PATH" pkg_expanded

          # 2. Recherche et montage de SharedSupport.dmg
          SHARED_SUPPORT_DMG=$(find pkg_expanded -type f -name "SharedSupport.dmg" | head -n 1)

          if [ -z "$SHARED_SUPPORT_DMG" ]; then
            echo "::error::SharedSupport.dmg introuvable dans pkg_expanded !"
            exit 1
          fi

          echo "DMG principal trouvé : $SHARED_SUPPORT_DMG"
          hdiutil attach "$SHARED_SUPPORT_DMG" -mountpoint /Volumes/SharedSupport -nobrowse -noverify

          # 3. Recherche récursive du DMG Cryptex / Asset imbriqué
          NESTED_DMG=$(find /Volumes/SharedSupport -type f \( -name "*.dmg" -o -name "com_apple_MobileAsset_*" \) 2>/dev/null | grep -E "\.dmg$" | head -n 1)

          if [ -z "$NESTED_DMG" ]; then
            NESTED_DMG=$(find /Volumes/SharedSupport -type f -size +100M 2>/dev/null | head -n 1)
          fi

          if [ -z "$NESTED_DMG" ]; then
            echo "::error::Impossible de localiser le DMG imbriqué dans /Volumes/SharedSupport !"
            ls -laR /Volumes/SharedSupport
            hdiutil detach /Volumes/SharedSupport -force || true
            exit 1
          fi

          echo "DMG imbriqué trouvé : $NESTED_DMG"
          mkdir -p /Volumes/Cryptex
          hdiutil attach "$NESTED_DMG" -mountpoint /Volumes/Cryptex -nobrowse -noverify
          echo "Montage réussi dans /Volumes/Cryptex."

      - name: Filter & Commit Frameworks
        run: |
          mkdir -p payloads/Frameworks

          if [ -d "/Volumes/Cryptex/System/Library/Frameworks" ]; then
            echo "Extraction des frameworks x86_64 vers payloads/Frameworks..."
            # Placer ici les commandes cp pour les frameworks cibles
          fi

          hdiutil detach /Volumes/Cryptex -force || true
          hdiutil detach /Volumes/SharedSupport -force || true

      - name: Commit Changes to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads/
          git diff --quiet && git diff --staged --quiet || (git commit -m "build(actions): extract x86_64 frameworks" && git push)
