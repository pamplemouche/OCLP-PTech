name: Extract x86_64 Frameworks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-frameworks:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw & pbzx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo blacktop/ipsw --pattern "ipsw_*_macOS_x86_64.tar.gz" --clobber
          tar -zxvf ipsw_*_macOS_x86_64.tar.gz
          chmod +x ipsw
          sudo mv ipsw /usr/local/bin/
          brew install pbzx

      - name: Download macOS 15 InstallAssistant & Extract Shared Cache
        run: |
          mkdir -p payloads/Frameworks/26_0/System/Library/Frameworks
          mkdir -p payloads/Frameworks/26_0/System/Library/PrivateFrameworks

          # Telechargement direct de l'InstallAssistant macOS 15 Sequoia
          ipsw download macos --version 15.0 --assistant -y

          # Extraction du paquet et du dyld_shared_cache_x86_64
          pkgutil --expand InstallAssistant.pkg pkg_expanded
          pbzx -n pkg_expanded/SharedSupport.pkg/Payload | cpio -i
          
          # Extraction des frameworks depuis le Shared Cache x86_64
          CACHE_PATH=$(find . -name "dyld_shared_cache_x86_64" | head -n 1)
          ipsw dyld extract "$CACHE_PATH" SkyLight CoreGraphics -o extracted_dylibs

      - name: Organize & Commit Extracted Frameworks
        run: |
          cp -R extracted_dylibs/SkyLight.framework payloads/Frameworks/26_0/System/Library/PrivateFrameworks/
          cp -R extracted_dylibs/CoreGraphics.framework payloads/Frameworks/26_0/System/Library/Frameworks/

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add payloads/Frameworks/26_0/
          git commit -m "Auto-extract : Ajout des binaires x86_64 SkyLight et CoreGraphics"
          git push
